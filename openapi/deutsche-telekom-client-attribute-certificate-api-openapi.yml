openapi: 3.2.0
info:
  title: Keycloak Admin REST Client Attribute Certificate API
  description: This is a REST API reference for the Keycloak Admin
  version: '1'
security:
- access_token: []
tags:
- name: Client Attribute Certificate
paths:
  /{realm}/clients/{id}/certificates/{attr}:
    parameters:
    - in: path
      name: realm
      description: realm name (not id!)
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: id
      description: id of client (not client-id)
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: attr
      required: true
      schema:
        type: string
      style: simple
    get:
      tags:
      - Client Attribute Certificate
      summary: Get key info
      responses:
        2XX:
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateRepresentation'
      operationId: getByRealmClientsByIdCertificatesByAttr
      x-operation-id-source: derived
  /{realm}/clients/{id}/certificates/{attr}/download:
    parameters:
    - in: path
      name: realm
      description: realm name (not id!)
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: id
      description: id of client (not client-id)
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: attr
      required: true
      schema:
        type: string
      style: simple
    post:
      tags:
      - Client Attribute Certificate
      summary: Get a keystore file for the client, containing private key and public…
      requestBody:
        description: Keystore configuration as JSON
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyStoreConfig'
        required: true
      responses:
        2XX:
          description: success
          content:
            application/octet-stream:
              schema:
                type: string
                format: byte
      operationId: postByRealmClientsByIdCertificatesByAttrDownload
      x-operation-id-source: derived
  /{realm}/clients/{id}/certificates/{attr}/generate:
    parameters:
    - in: path
      name: realm
      description: realm name (not id!)
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: id
      description: id of client (not client-id)
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: attr
      required: true
      schema:
        type: string
      style: simple
    post:
      tags:
      - Client Attribute Certificate
      summary: Generate a new certificate with new key pair
      responses:
        2XX:
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateRepresentation'
      operationId: postByRealmClientsByIdCertificatesByAttrGenerate
      x-operation-id-source: derived
  /{realm}/clients/{id}/certificates/{attr}/generate-and-download:
    parameters:
    - in: path
      name: realm
      description: realm name (not id!)
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: id
      description: id of client (not client-id)
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: attr
      required: true
      schema:
        type: string
      style: simple
    post:
      tags:
      - Client Attribute Certificate
      summary: Generate a new keypair and certificate, and get the private key file Generates…
      requestBody:
        description: Keystore configuration as JSON
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyStoreConfig'
        required: true
      responses:
        2XX:
          description: success
          content:
            application/octet-stream:
              schema:
                type: string
                format: byte
      operationId: postByRealmClientsByIdCertificatesByAttrGenerateAndDownload
      x-operation-id-source: derived
  /{realm}/clients/{id}/certificates/{attr}/upload:
    parameters:
    - in: path
      name: realm
      description: realm name (not id!)
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: id
      description: id of client (not client-id)
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: attr
      required: true
      schema:
        type: string
      style: simple
    post:
      tags:
      - Client Attribute Certificate
      summary: Upload certificate and eventually private key
      responses:
        2XX:
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateRepresentation'
      operationId: postByRealmClientsByIdCertificatesByAttrUpload
      x-operation-id-source: derived
  /{realm}/clients/{id}/certificates/{attr}/upload-certificate:
    parameters:
    - in: path
      name: realm
      description: realm name (not id!)
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: id
      description: id of client (not client-id)
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: attr
      required: true
      schema:
        type: string
      style: simple
    post:
      tags:
      - Client Attribute Certificate
      summary: Upload only certificate, not private key
      responses:
        2XX:
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateRepresentation'
      operationId: postByRealmClientsByIdCertificatesByAttrUploadCertificate
      x-operation-id-source: derived
components:
  schemas:
    CertificateRepresentation:
      type: object
      properties:
        certificate:
          type: string
        kid:
          type: string
        privateKey:
          type: string
        publicKey:
          type: string
    KeyStoreConfig:
      type: object
      properties:
        format:
          type: string
        keyAlias:
          type: string
        keyPassword:
          type: string
        realmAlias:
          type: string
        realmCertificate:
          type: boolean
        storePassword:
          type: string
  securitySchemes:
    access_token:
      type: http
      scheme: bearer
      bearerFormat: null
externalDocs:
  description: Schema source code
  url: https://github.com/keycloak/keycloak/tree/6.0.1/core/src/main/java/org/keycloak/representations
