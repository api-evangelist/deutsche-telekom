openapi: 3.2.0
info:
  title: Keycloak Admin REST User Storage Provider API
  description: This is a REST API reference for the Keycloak Admin
  version: '1'
security:
- access_token: []
tags:
- name: User Storage Provider
paths:
  /{id}/name:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    get:
      tags:
      - User Storage Provider
      summary: Need this for admin console to display simple name of provider when displaying…
      responses:
        2XX:
          description: success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      operationId: getByIdName
      x-operation-id-source: derived
  /{realm}/user-storage/{id}/name:
    parameters:
    - in: path
      name: realm
      description: realm name (not id!)
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    get:
      tags:
      - User Storage Provider
      summary: Need this for admin console to display simple name of provider when displaying…
      responses:
        2XX:
          description: success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      operationId: getByRealmUserStorageByIdName
      x-operation-id-source: derived
  /{realm}/user-storage/{id}/remove-imported-users:
    parameters:
    - in: path
      name: realm
      description: realm name (not id!)
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    post:
      tags:
      - User Storage Provider
      summary: Remove imported users
      responses:
        2XX:
          description: success
      operationId: postByRealmUserStorageByIdRemoveImportedUsers
      x-operation-id-source: derived
  /{realm}/user-storage/{id}/sync:
    parameters:
    - in: path
      name: realm
      description: realm name (not id!)
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    post:
      tags:
      - User Storage Provider
      summary: Trigger sync of users Action can be "triggerFullSync" or…
      parameters:
      - in: query
        name: action
        schema:
          type: string
        style: form
      responses:
        2XX:
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SynchronizationResult'
      operationId: postByRealmUserStorageByIdSync
      x-operation-id-source: derived
  /{realm}/user-storage/{id}/unlink-users:
    parameters:
    - in: path
      name: realm
      description: realm name (not id!)
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    post:
      tags:
      - User Storage Provider
      summary: Unlink imported users from a storage provider
      responses:
        2XX:
          description: success
      operationId: postByRealmUserStorageByIdUnlinkUsers
      x-operation-id-source: derived
  /{realm}/user-storage/{parentId}/mappers/{id}/sync:
    parameters:
    - in: path
      name: realm
      description: realm name (not id!)
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: parentId
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    post:
      tags:
      - User Storage Provider
      summary: Trigger sync of mapper data related to ldap mapper (roles, groups, …​)…
      parameters:
      - in: query
        name: direction
        schema:
          type: string
        style: form
      responses:
        2XX:
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SynchronizationResult'
      operationId: postByRealmUserStorageByParentIdMappersByIdSync
      x-operation-id-source: derived
components:
  schemas:
    SynchronizationResult:
      type: object
      properties:
        added:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
        ignored:
          type: boolean
        removed:
          type: integer
          format: int32
        status:
          type: string
        updated:
          type: integer
          format: int32
  securitySchemes:
    access_token:
      type: http
      scheme: bearer
      bearerFormat: null
externalDocs:
  description: Schema source code
  url: https://github.com/keycloak/keycloak/tree/6.0.1/core/src/main/java/org/keycloak/representations
