openapi: 3.2.0
info:
  title: Keycloak Admin REST Roles (by ID) API
  description: This is a REST API reference for the Keycloak Admin
  version: '1'
security:
- access_token: []
tags:
- name: Roles (by ID)
paths:
  /{realm}/roles-by-id/{role-id}:
    parameters:
    - in: path
      name: realm
      description: realm name (not id!)
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: role-id
      description: id of role
      required: true
      schema:
        type: string
      style: simple
    get:
      tags:
      - Roles (by ID)
      summary: Get a specific role’s representation
      responses:
        2XX:
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleRepresentation'
      operationId: getByRealmRolesByIdByRoleId
      x-operation-id-source: derived
    put:
      tags:
      - Roles (by ID)
      summary: Update the role
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRepresentation'
        required: true
      responses:
        2XX:
          description: success
      operationId: putByRealmRolesByIdByRoleId
      x-operation-id-source: derived
    delete:
      tags:
      - Roles (by ID)
      summary: Delete the role
      responses:
        2XX:
          description: success
      operationId: deleteByRealmRolesByIdByRoleId
      x-operation-id-source: derived
  /{realm}/roles-by-id/{role-id}/composites:
    parameters:
    - in: path
      name: realm
      description: realm name (not id!)
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: role-id
      description: Role id
      required: true
      schema:
        type: string
      style: simple
    get:
      tags:
      - Roles (by ID)
      summary: Get role’s children Returns a set of role’s children provided the role is a…
      responses:
        2XX:
          description: success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleRepresentation'
      operationId: getByRealmRolesByIdByRoleIdComposites
      x-operation-id-source: derived
    post:
      tags:
      - Roles (by ID)
      summary: Make the role a composite role by associating some child roles
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/RoleRepresentation'
        required: true
      responses:
        2XX:
          description: success
      operationId: postByRealmRolesByIdByRoleIdComposites
      x-operation-id-source: derived
    delete:
      tags:
      - Roles (by ID)
      summary: Remove a set of roles from the role’s composite
      requestBody:
        description: A set of roles to be removed
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/RoleRepresentation'
        required: true
      responses:
        2XX:
          description: success
      operationId: deleteByRealmRolesByIdByRoleIdComposites
      x-operation-id-source: derived
  /{realm}/roles-by-id/{role-id}/composites/clients/{client}:
    parameters:
    - in: path
      name: realm
      description: realm name (not id!)
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: role-id
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: client
      required: true
      schema:
        type: string
      style: simple
    get:
      tags:
      - Roles (by ID)
      summary: Get client-level roles for the client that are in the role’s composite
      responses:
        2XX:
          description: success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleRepresentation'
      operationId: getByRealmRolesByIdByRoleIdCompositesClientsByClient
      x-operation-id-source: derived
  /{realm}/roles-by-id/{role-id}/composites/realm:
    parameters:
    - in: path
      name: realm
      description: realm name (not id!)
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: role-id
      required: true
      schema:
        type: string
      style: simple
    get:
      tags:
      - Roles (by ID)
      summary: Get realm-level roles that are in the role’s composite
      responses:
        2XX:
          description: success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleRepresentation'
      operationId: getByRealmRolesByIdByRoleIdCompositesRealm
      x-operation-id-source: derived
  /{realm}/roles-by-id/{role-id}/management/permissions:
    parameters:
    - in: path
      name: realm
      description: realm name (not id!)
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: role-id
      required: true
      schema:
        type: string
      style: simple
    get:
      tags:
      - Roles (by ID)
      summary: Return object stating whether role Authoirzation permissions have been…
      responses:
        2XX:
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementPermissionReference'
      operationId: getByRealmRolesByIdByRoleIdManagementPermissions
      x-operation-id-source: derived
    put:
      tags:
      - Roles (by ID)
      summary: Return object stating whether role Authoirzation permissions have been…
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagementPermissionReference'
        required: true
      responses:
        2XX:
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementPermissionReference'
      operationId: putByRealmRolesByIdByRoleIdManagementPermissions
      x-operation-id-source: derived
components:
  schemas:
    RoleRepresentation:
      type: object
      properties:
        attributes:
          type: object
          additionalProperties: true
        clientRole:
          type: boolean
        composite:
          type: boolean
        composites:
          $ref: '#/components/schemas/RoleRepresentation-Composites'
        containerId:
          type: string
        description:
          type: string
        id:
          type: string
        name:
          type: string
    RoleRepresentation-Composites:
      type: object
      properties:
        client:
          type: object
          additionalProperties: true
        realm:
          type: array
          items:
            type: string
    ManagementPermissionReference:
      type: object
      properties:
        enabled:
          type: boolean
        resource:
          type: string
        scopePermissions:
          type: object
          additionalProperties: true
  securitySchemes:
    access_token:
      type: http
      scheme: bearer
      bearerFormat: null
externalDocs:
  description: Schema source code
  url: https://github.com/keycloak/keycloak/tree/6.0.1/core/src/main/java/org/keycloak/representations
