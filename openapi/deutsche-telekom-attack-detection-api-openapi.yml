openapi: 3.2.0
info:
  title: Keycloak Admin REST Attack Detection API
  description: This is a REST API reference for the Keycloak Admin
  version: '1'
security:
- access_token: []
tags:
- name: Attack Detection
paths:
  /{realm}/attack-detection/brute-force/users:
    parameters:
    - in: path
      name: realm
      description: realm name (not id!)
      required: true
      schema:
        type: string
      style: simple
    delete:
      tags:
      - Attack Detection
      summary: Clear any user login failures for all users   This can release temporary disabled users
      responses:
        2XX:
          description: success
  /{realm}/attack-detection/brute-force/users/{userId}:
    parameters:
    - in: path
      name: realm
      description: realm name (not id!)
      required: true
      schema:
        type: string
      style: simple
    - in: path
      name: userId
      required: true
      schema:
        type: string
      style: simple
    get:
      tags:
      - Attack Detection
      summary: Get status of a username in brute force detection
      responses:
        2XX:
          description: success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    delete:
      tags:
      - Attack Detection
      summary: Clear any user login failures for the user   This can release temporary disabled user
      responses:
        2XX:
          description: success
components:
  securitySchemes:
    access_token:
      type: http
      scheme: bearer
      bearerFormat: null
externalDocs:
  description: Schema source code
  url: https://github.com/keycloak/keycloak/tree/6.0.1/core/src/main/java/org/keycloak/representations
